       column lives, so the hole it needs is at the top rather than one slot
       down. It still has to line up with #lens-handle exactly — see the note
       there. -->
  <div id="lens-gap" aria-hidden="true"></div>

  <!-- A sparkle: two four-pointed stars with concave sides, drawn rather than
       typed. The first attempt was a daisy of eight radial petals and read as a
       gear — at 18px, anything with that many evenly spaced lobes does. Concave
       sides are what separate a sparkle from a star or a cog.
       Not the sparkle character: emoji carry colour presentation, so Android
       substitutes its own glyph and ignores `color` — the trap that made the
       transport buttons orange on Android. -->
  <button id="dazzle-btn" type="button" title="Dazzle" aria-label="Dazzle">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M10 3 Q11 12 17 13 Q11 14 10 23 Q9 14 3 13 Q9 12 10 3 Z"/>
      <path d="M18.5 2 Q19 5.5 22.5 6 Q19 6.5 18.5 10 Q18 6.5 14.5 6 Q18 5.5 18.5 2 Z"/>
    </svg>
  </button>

  <!-- A cup on a stem, drawn rather than typed, for the reason given above and
       repeated everywhere in this file. -->
  <button id="achievements-btn" type="button" title="Achievements" aria-label="Achievements">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M7 4h10v5a5 5 0 0 1-10 0z"/>
      <path d="M7 6H4.5a2.5 2.5 0 0 0 2.5 2.5"/>
      <path d="M17 6h2.5A2.5 2.5 0 0 1 17 8.5"/>
      <path d="M12 14v3"/>
      <path d="M9 20h6"/>
      <path d="M10 17h4l.5 3h-5z"/>
    </svg>
  </button>

  <!-- ADS. A plus sign, which is both the icon and the product: what is for
       sale behind it is advertising for the addition operator. modules/ads.js
       owns everything past the tap; this is only the door. The multiplication
       button is created by that module and inserted after this one, because it
       does not exist until the first product is owned. -->
  <button id="ads-btn" type="button" title="Ads" aria-label="Ads">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true">
      <path d="M12 5v14"/>
      <path d="M5 12h14"/>
    </svg>
  </button>

  <!-- CLEAR VIEW. Hides every interface so the figure has the screen to
       itself. The way back is #restore-ui in the opposite corner, which is
       deliberately the ONLY thing left on screen — a clear view you cannot
       leave is a trap, and putting the exit where the controls were would
       defeat the point of hiding them. -->
  <button id="clear-view-btn" type="button" title="Clear view" aria-label="Hide all controls">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9"/>
      <path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9"/>
      <path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"/>
      <path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/>
    </svg>
  </button>
</div>

<!-- The way out of clear view. Top LEFT, opposite the stack it replaces. -->
<button id="restore-ui" type="button" title="Show controls" aria-label="Show controls">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5V9"/>
    <path d="M20 9V5.5A1.5 1.5 0 0 0 18.5 4H15"/>
    <path d="M15 20h3.5a1.5 1.5 0 0 0 1.5-1.5V15"/>
    <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20H9"/>
  </svg>
</button>

<div id="viewport"></div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three/three.module.js",
    "three/addons/": "./lib/three/addons/"
  }
}
</script>
<script type="module">
  import { init } from './core/renderer.js';
  import { initPanel } from './core/panel.js';
  import { initSheet } from './core/sheet.js';
  import { initTransport } from './core/transport.js';
  // watchForUpdates is gone with the service worker: in the shell, updates
  // arrive through the Play Store and the app has no say in them. The error
  // boundary stays — it is the one part of notices.js that matters more here,
  // not less, because there is no address bar to reload from.
  import {
    installGlobalErrorBoundary, markRendered, showFatalError,
  } from './core/notices.js';

  // Armed before anything else runs, so a failure during startup has somewhere
  // to be reported. It only fires while the app has not yet rendered — see
  // notices.js — so a stray rejection later cannot blank a working scene.
  installGlobalErrorBoundary();

  // First: sets the sheet's initial state, so everything below sizes against
  // the layout the user will actually see.
  initSheet();

  // Dynamic module loading — each one is isolated
  const featureModules = [
    './modules/physics.js',
    './modules/info.js',
    './modules/lens.js',   // after info.js — it calls into that module's API
    './modules/ads.js',
    './modules/achievements.js',   // last: it listens to the others, never the reverse
  ];

  for (const path of featureModules) {
    try {
      const m = await import(path);
      m.register();
    } catch (err) {
      console.error(`[PNM] Failed to load module ${path}:`, err);
    }
  }

  // Panel and renderer, inside a boundary. Everything above this point either
  // has its own error handling (the module loop) or cannot fail usefully; from
  // here on a throw means no visualisation, and a black rectangle explains
  // nothing to someone who paid for this.
  try {
    // Build panel (reads registered modules + shapes)
    initPanel();

    // Start renderer
    init(document.getElementById('viewport'));

    // After the renderer, so the playhead reads a live dimension on its first
    // frame rather than the default.
    initTransport();

    // From here a later failure is a bump, not a dead app, so the global
    // boundary stands down.
    markRendered();
  } catch (err) {
    console.error('[PNM] Fatal error during startup:', err);
    showFatalError(err);
  }

  // DEV: no service worker here, deliberately, and this comment is the guard
  // rail. The web builds register one to cache themselves for offline use; the
  // shell has no use for that — the APK *is* the offline copy, installed on the
  // device by the store. Registering one anyway would reintroduce the single
  // most expensive bug in this project's history: a cache that answers
  // navigations for its whole scope and serves last week's code to a user who
  // just updated. docs/HANDOFF.md §4 counts four separate occasions.
  //
  // If you are here because you want offline support: you already have it.
</script>
</body>
</html>
